services:
  # --- PostgreSQL ---
  postgres:
    image: postgres:16-alpine
    container_name: tw-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tenderwriter}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-DefaultPg2024Pass}
      POSTGRES_DB: ${POSTGRES_DB:-tenderwriter}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tenderwriter}" ]
      interval: 10s
      timeout: 10s
      retries: 5

  # --- Qdrant (Vector Database) ---
  qdrant:
    image: qdrant/qdrant:v1.13.0
    container_name: tw-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: [ "CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/6333'" ]
      interval: 10s
      timeout: 10s
      retries: 5

  # --- Neo4j Community (Knowledge Graph) ---
  neo4j:
    image: neo4j:5-community
    container_name: tw-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-DefaultNEO4J2024Pass}
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474" # Browser UI
      - "7687:7687" # Bolt protocol
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: [ "CMD-SHELL", "cypher-shell -u neo4j -p ${NEO4J_PASSWORD:-DefaultNEO4J2024Pass} 'RETURN 1'" ]
      interval: 20s
      timeout: 20s
      retries: 5

  # --- Ollama (Local LLM - DEPRECATED, use llama-server instead) ---
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: tw-ollama
  #   restart: unless-stopped
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama_data:/root/.ollama

  # --- llama.cpp Server for TenderWriter RAG ---
  llama-tender:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: tw-llama-tender
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./models:/models
      - llama_tender_cache:/root/.cache/llama.cpp
    entrypoint: [ "/app/llama-server" ]
    command: [ "-m", "/models/qwen2.5-3b-instruct-q4_k_m.gguf", "--host", "0.0.0.0", "--port", "8080", "-c", "4096", "-t", "16", "--n-predict", "512", "-b", "512" ]
    networks:
      - default

  # --- OpenCode stack temporarily disabled ---
  # --- llama.cpp Server for OpenCode (Agentic Coder) ---
  # llama-opencode:
  #   image: ghcr.io/ggml-org/llama.cpp:server
  #   container_name: tw-llama-opencode
  #   restart: unless-stopped
  #   ports:
  #     - "8081:8080"
  #   volumes:
  #     - ./models:/models
  #     - llama_opencode_cache:/root/.cache/llama.cpp
  #   entrypoint: [ "/app/llama-server" ]
  #   command: [ "-m", "/models/Qwen2.5-Coder-3B-Instruct-Q8_0.gguf", "--host", "0.0.0.0", "--port", "8080", "-c", "8192", "-t", "16" ]
  #   networks:
  #     - default

  # --- OpenCode Web (AI Coding Agent) ---
  # opencode:
  #   image: ghcr.io/anomalyco/opencode:latest
  #   container_name: tw-opencode
  #   restart: unless-stopped
  #   stdin_open: true
  #   tty: true
  #   ports:
  #     - "4096:4096"
  #   volumes:
  #     - ./backend:/workspace/backend:ro
  #     - ./frontend:/workspace/frontend:ro
  #     - opencode_config:/home/opencode/.config/opencode
  #     - opencode_data:/home/opencode/.local/share/opencode
  #   environment:
  #     - OPENCODE_BASE_URL=http://tw-gateway:8081/v1
  #     - OPENCODE_MODEL=llama-cpp/qwen2.5-32b-instruct
  #     - OPENCODE_SERVER_PORT=4096
  #     - OPENCODE_SERVER_HOST=0.0.0.0
  #     # Per usare modelli cloud (Anthropic/OpenAI), imposta:
  #     # - ANTHROPIC_API_KEY=your-key
  #     # - OPENAI_API_KEY=your-key
  #   command: [ "web", "--hostname", "0.0.0.0", "--port", "4096" ]
  #   depends_on:
  #     llama-opencode:
  #       condition: service_started
  #   networks:
  #     - default
  #   extra_hosts:
  #     - "host.docker.internal:host-gateway"

  # --- OpenCode CLI (Terminal Mode) ---
  # opencode-cli:
  #   image: ghcr.io/anomalyco/opencode:latest
  #   container_name: tw-opencode-cli
  #   restart: unless-stopped
  #   stdin_open: true
  #   tty: true
  #   volumes:
  #     - ./backend:/workspace/backend:ro
  #     - ./frontend:/workspace/frontend:ro
  #     - opencode_config:/home/opencode/.config/opencode
  #     - opencode_data:/home/opencode/.local/share/opencode
  #   environment:
  #     - OPENCODE_BASE_URL=http://tw-gateway:8081/v1
  #     - OPENCODE_MODEL=llama-cpp/qwen2.5-32b-instruct
  #   depends_on:
  #     llama-opencode:
  #       condition: service_started
  #   networks:
  #     - default
  #   extra_hosts:
  #     - "host.docker.internal:host-gateway"

  # --- MinIO (Object Storage) ---
  minio:
    image: minio/minio:latest
    container_name: minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-DefaultMinIO2024Pass}
    ports:
      - "9000:9000"
      - "9001:9001" # Console UI
    volumes:
      - minio_data:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 10s
      timeout: 10s
      retries: 5

  # --- Redis (Task Queue backend) ---
  redis:
    image: redis:7-alpine
    container_name: tw-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 10s
      retries: 5

  # --- Redis Insight (Redis GUI) ---
  redis-insight:
    image: rediscommander/redis-commander:latest
    container_name: tw-redis-insight
    restart: unless-stopped
    ports:
      - "8001:8081"
    environment:
      - REDIS_HOSTS=local:redis:6379

  # --- Celery Worker ---
  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tw-celery-worker
    restart: unless-stopped
    command: celery -A app.celery worker --loglevel=info --concurrency=2
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app

  # --- Celery Beat (Scheduler) ---
  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tw-celery-beat
    restart: unless-stopped
    command: celery -A app.celery beat --loglevel=info
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./backend/app:/app/app

  # --- Mailpit (SMTP Testing) ---
  mailpit:
    image: axllent/mailpit:latest
    container_name: tw-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025" # Web UI
      - "1025:1025" # SMTP

  # --- Privileged Ops Agent ---
  ops-agent:
    build:
      context: ./ops-agent
      dockerfile: Dockerfile
    container_name: tw-ops-agent
    restart: unless-stopped
    environment:
      OPS_AGENT_TOKEN: ${OPS_AGENT_TOKEN}
      OPS_ALLOWED_PREFIX: ${OPS_ALLOWED_PREFIX:-tw-}
      OPS_FRONTEND_CONTAINER: ${OPS_FRONTEND_CONTAINER:-tw-frontend}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8070/health" ]
      interval: 10s
      timeout: 10s
      retries: 5

  # --- Backend (FastAPI) ---
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tw-backend
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      QDRANT_HOST: ${QDRANT_HOST}
      QDRANT_PORT: ${QDRANT_PORT}
      NEO4J_URI: ${NEO4J_URI}
      NEO4J_USER: ${NEO4J_USER}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
      OLLAMA_MODEL: ${OLLAMA_MODEL}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      REDIS_URL: ${REDIS_URL}
      APP_SECRET_KEY: ${APP_SECRET_KEY}
      ONLYOFFICE_JWT_SECRET: ${ONLYOFFICE_JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS}
      LLAMA_SERVER_URL: http://tw-gateway:8080/v1
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_ENABLED: ${ADMIN_ENABLED}
      MINIO_BUCKET: ${MINIO_BUCKET}
      MINIO_CHAT_BUCKET: ${MINIO_CHAT_BUCKET:-tenderwriter-chat}
      MINIO_SECURE: ${MINIO_SECURE}
      ONLYOFFICE_INTERNAL_URL: ${ONLYOFFICE_INTERNAL_URL}
      BACKEND_PUBLIC_URL: ${BACKEND_PUBLIC_URL}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      SMTP_TLS: ${SMTP_TLS}
      KPI_REASON_ENGINE_BASE_URL: ${KPI_REASON_ENGINE_BASE_URL:-http://tw-kpi-reason-engine:8010}
      KPI_REASON_ENGINE_SERVICE_TOKEN: ${KPI_REASON_ENGINE_SERVICE_TOKEN:-changeme-kpi-service-token}
      OPS_AGENT_BASE_URL: ${OPS_AGENT_BASE_URL:-http://tw-ops-agent:8070}
      OPS_AGENT_TOKEN: ${OPS_AGENT_TOKEN}
      OPS_AGENT_TIMEOUT: ${OPS_AGENT_TIMEOUT:-5}
      MM_INTERNAL_URL: http://mattermost:8065
      MM_PUBLIC_URL: ${MM_SITE_URL:-http://localhost:8065}
      MM_ADMIN_USER: ${MM_ADMIN_USER:-tw-admin}
      MM_ADMIN_PASS: ${MM_ADMIN_PASS:-TW2026Secure!Pass}
      MM_EDITION: ${MM_EDITION:-team}
      # --- Auth Provider (set to "keycloak" to enable OIDC) ---
      AUTH_PROVIDER: ${AUTH_PROVIDER:-legacy}
      KEYCLOAK_URL: ${KEYCLOAK_URL:-http://localhost:8180}
      KEYCLOAK_INTERNAL_URL: ${KEYCLOAK_INTERNAL_URL:-http://keycloak:8080}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-tenderwriter}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-tw-frontend}
      ANONYMIZER_ENABLED: ${ANONYMIZER_ENABLED:-false}
      ANONYMIZER_URL: ${ANONYMIZER_URL:-http://tw-anonymizer:8090}
      ANONYMIZER_TIMEOUT: ${ANONYMIZER_TIMEOUT:-8}
      ANONYMIZER_ADMIN_TOKEN: ${ANONYMIZER_ADMIN_TOKEN:-}
      EXTERNAL_LLM_URL: ${EXTERNAL_LLM_URL:-}
      EXTERNAL_LLM_MODEL: ${EXTERNAL_LLM_MODEL:-}
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - ./backend/app:/app/app # Hot reload in development
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 180s

  # --- OnlyOffice Document Server ---
  onlyoffice:
    image: onlyoffice/documentserver:latest
    container_name: tw-onlyoffice
    restart: unless-stopped
    environment:
      JWT_ENABLED: "true"
      JWT_SECRET: "${ONLYOFFICE_JWT_SECRET:-changeme_oo_jwt_secret}"
    ports:
      - "8443:80"
    volumes:
      - onlyoffice_data:/var/log/onlyoffice
      - onlyoffice_lib:/var/lib/onlyoffice

  # --- KPI Reason Engine ---
  kpi-reason-engine:
    build:
      context: ./kpi-reason-engine
      dockerfile: Dockerfile
    container_name: tw-kpi-reason-engine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      KPI_REASON_ENGINE_APP_DEBUG: ${APP_DEBUG:-false}
      KPI_REASON_ENGINE_APP_HOST: 0.0.0.0
      KPI_REASON_ENGINE_APP_PORT: 8010
      KPI_REASON_ENGINE_LOG_LEVEL: info
      KPI_REASON_ENGINE_PUBLIC_BASE_URL: ${KPI_REASON_ENGINE_BASE_URL:-http://tw-kpi-reason-engine:8010}
      KPI_REASON_ENGINE_SERVICE_TOKEN: ${KPI_REASON_ENGINE_SERVICE_TOKEN:-changeme-kpi-service-token}
      KPI_REASON_ENGINE_DATABASE_URL: ${KPI_REASON_ENGINE_DATABASE_URL:-postgresql+psycopg://tenderwriter:DefaultPg2024Pass@postgres:5432/tenderwriter}
      KPI_REASON_ENGINE_DATABASE_SCHEMA: ${KPI_REASON_ENGINE_DATABASE_SCHEMA:-kpi_engine}
      KPI_REASON_ENGINE_DATABASE_PATH: ${KPI_REASON_ENGINE_DATABASE_PATH:-/tmp/kpi_reason_engine.db}
      KPI_REASON_ENGINE_LEGACY_DATABASE_PATH: ${KPI_REASON_ENGINE_LEGACY_DATABASE_PATH:-}
      KPI_REASON_ENGINE_AUTO_MIGRATE_LEGACY_ON_STARTUP: ${KPI_REASON_ENGINE_AUTO_MIGRATE_LEGACY_ON_STARTUP:-false}
      KPI_REASON_ENGINE_VALIDATE_LEGACY_MIGRATION: ${KPI_REASON_ENGINE_VALIDATE_LEGACY_MIGRATION:-false}
    ports:
      - "${KPI_REASON_ENGINE_PORT:-8010}:8010"
    volumes:
      - ./kpi-reason-engine/app:/app/app
      - ./kpi-reason-engine/docs:/app/docs
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8010/health" ]
      interval: 10s
      timeout: 10s
      retries: 5

  # --- Frontend (React + Vite) ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: tw-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      MM_LOGIN_REDIRECT_MODE: ${MM_LOGIN_REDIRECT_MODE:-off}
    volumes:
      - ./frontend/src:/app/src # Hot reload in development

  # --- Mock External LLM (Python) ---
  mock-external-llm:
    image: python:3.12-slim
    container_name: tw-mock-external-llm
    restart: unless-stopped
    working_dir: /workspace
    command: [ "python", "/workspace/utility/mock_external_llm.py" ]
    environment:
      MOCK_EXTERNAL_LLM_HOST: 0.0.0.0
      MOCK_EXTERNAL_LLM_PORT: 18080
      MOCK_EXTERNAL_LLM_MODEL: ${MOCK_EXTERNAL_LLM_MODEL:-mock-external-llm}
    ports:
      - "${MOCK_EXTERNAL_LLM_PORT:-18080}:18080"
    volumes:
      - ./utility:/workspace/utility:ro
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18080/health').read()" ]
      interval: 10s
      timeout: 10s
      retries: 5

  # --- Gateway (AI Router) ---
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: tw-gateway
    restart: unless-stopped
    environment:
      GATEWAY_TENDER_UPSTREAM: http://llama-tender:8080
      GATEWAY_OPENCODE_UPSTREAM: http://llama-opencode:8080
      GATEWAY_TIMEOUT: 30
      GATEWAY_TENDER_DMZ_UPSTREAM: http://llama-tender:8080
      GATEWAY_OPENCODE_DMZ_UPSTREAM: http://llama-opencode:8080
      GATEWAY_ANONYMIZER_URL: http://tw-anonymizer:8090
      GATEWAY_TENDER_CLOUD_PROVIDER: ${GATEWAY_TENDER_CLOUD_PROVIDER:-}
      GATEWAY_OPENAI_BASE_URL: ${GATEWAY_OPENAI_BASE_URL:-https://api.openai.com}
      GATEWAY_OPENAI_API_KEY: ${GATEWAY_OPENAI_API_KEY:-}
      GATEWAY_ANTHROPIC_BASE_URL: ${GATEWAY_ANTHROPIC_BASE_URL:-https://api.anthropic.com}
      GATEWAY_ANTHROPIC_API_KEY: ${GATEWAY_ANTHROPIC_API_KEY:-}
    depends_on:
      llama-tender:
        condition: service_started
    ports:
      - "8085:8080"
      - "8086:8081"

  # --- Anonymizer (transparent relay for DMZ/externals) ---
  anonymizer:
    build:
      context: ./anonymizer
      dockerfile: Dockerfile
    container_name: tw-anonymizer
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    environment:
      ANONYMIZER_REDIS_URL: ${ANONYMIZER_REDIS_URL:-redis://redis:6379/1}
      ANONYMIZER_NER_BACKEND: ${ANONYMIZER_NER_BACKEND:-presidio_spacy}
    ports:
      - "8090:8090"

  # ===================================================================
  # KEYCLOAK IAM (Identity & Access Management)
  # ===================================================================

  # --- Keycloak PostgreSQL (dedicated) ---
  kc-postgres:
    profiles: [ "keycloak" ]
    image: postgres:16-alpine
    container_name: tw-kc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${KC_DB_USER:-keycloak}
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD:-DefaultKC2026Pass}
      POSTGRES_DB: ${KC_DB_NAME:-keycloak}
    volumes:
      - kc_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${KC_DB_USER:-keycloak}" ]
      interval: 10s
      timeout: 10s
      retries: 5

  # --- Keycloak ---
  keycloak:
    profiles: [ "keycloak" ]
    image: quay.io/keycloak/keycloak:${KC_IMAGE_TAG:-26.1}
    container_name: tw-keycloak
    restart: unless-stopped
    depends_on:
      kc-postgres:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://kc-postgres:5432/${KC_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${KC_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:-DefaultKC2026Pass}
      KC_HOSTNAME: http://${KC_HOSTNAME:-localhost}:${KC_PORT:-8180}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
      KC_HTTP_PORT: 8080
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "false"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:-DefaultKCAdmin2026Pass}
    command:
      - start-dev
      - --import-realm
    ports:
      - "${KC_PORT:-8180}:8080"
    volumes:
      - ./keycloak/tenderwriter-realm.json:/opt/keycloak/data/import/tenderwriter-realm.json:ro
    healthcheck:
      test: [ "CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '200'" ]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ===================================================================
  # VIDEO CALL TRANSCRIPTION STACK (Mattermost + Jitsi + Jigasi + Vosk)
  # ===================================================================

  # --- Mattermost PostgreSQL (dedicated, not shared with TenderWriter) ---
  mm-postgres:
    profiles: [ "videochat" ]
    image: postgres:16-alpine
    container_name: tw-mm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${MM_DBUSER:-mmuser}
      POSTGRES_PASSWORD: ${MM_DBPASS:-DefaultMM2024Pass}
      POSTGRES_DB: ${MM_DBNAME:-mattermost}
    volumes:
      - mm_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${MM_DBUSER:-mmuser}" ]
      interval: 10s
      timeout: 10s
      retries: 5

  # --- Mattermost OIDC Plugin Builder (Team Edition only) ---
  # Builds the TW OIDC plugin and copies it to the plugins volume.
  # Only needed when MM_EDITION=team; harmless when enterprise.
  mm-plugin-oidc:
    profiles: [ "videochat" ]
    build:
      context: ./mattermost-plugin-oidc
    container_name: tw-mm-plugin-oidc
    volumes:
      - mm_plugins:/mnt/plugins
    restart: "no"

  # --- Mattermost (switchable: team or enterprise) ---
  # MM_EDITION=team       → Team Edition (open source, OIDC via plugin, default)
  # MM_EDITION=enterprise → Enterprise Edition (Entry mode, free, native OIDC)
  mattermost:
    profiles: [ "videochat" ]
    image: mattermost/mattermost-${MM_EDITION:-team}-edition:${MM_IMAGE_TAG:-10.11.8}
    container_name: tw-mattermost
    restart: unless-stopped
    depends_on:
      mm-postgres:
        condition: service_healthy
      mm-plugin-oidc:
        condition: service_started
    environment:
      MM_SQLSETTINGS_DRIVERNAME: postgres
      MM_SQLSETTINGS_DATASOURCE: "postgres://${MM_DBUSER:-mmuser}:${MM_DBPASS:-DefaultMM2024Pass}@mm-postgres:5432/${MM_DBNAME:-mattermost}?sslmode=disable&connect_timeout=10"
      MM_SERVICESETTINGS_SITEURL: http://localhost:3000/mm
      MM_PLUGINSETTINGS_ENABLE: "true"
      MM_PLUGINSETTINGS_REQUIREPLUGINSIGNATURE: "false"
      MM_PLUGINSETTINGS_PLUGINSTATES: >-
        {"com.mattermost.calls":{"Enable":true},"com.mattermost.nps":{"Enable":true},"jitsi":{"Enable":true},"mattermost-ai":{"Enable":true},"com.tenderwriter.oidc":{"Enable":${TW_OIDC_ENABLE:-false}}}
      MM_SERVICESETTINGS_ENABLEUSERACCESSTOKENS: "true"
      MM_PLUGINSETTINGS_ENABLEUPLOADS: "true"
      MM_BLEVESETTINGS_INDEXDIR: /mattermost/bleve-indexes
      # --- Native OpenID Connect (Enterprise Edition only) ---
      MM_OPENIDSETTINGS_ENABLE: "${MM_OIDC_ENABLE:-false}"
      MM_OPENIDSETTINGS_DISCOVERYENDPOINT: "${MM_OIDC_DISCOVERY_ENDPOINT:-http://keycloak:8080/realms/tenderwriter/.well-known/openid-configuration}"
      MM_OPENIDSETTINGS_ID: "${MM_OIDC_CLIENT_ID:-mattermost}"
      MM_OPENIDSETTINGS_SECRET: "${MM_OIDC_CLIENT_SECRET:-CHANGE_ME_mattermost_client_secret}"
      MM_OPENIDSETTINGS_BUTTONTEXT: "${MM_OIDC_BUTTON_TEXT:-Accedi con Keycloak}"
      MM_OPENIDSETTINGS_BUTTONCOLOR: "${MM_OIDC_BUTTON_COLOR:-#0058CC}"
      # --- TW OIDC Plugin (Team Edition only) ---
      TW_OIDC_ENABLE: "${TW_OIDC_ENABLE:-false}"
      TW_OIDC_DISCOVERY_ENDPOINT: "${MM_OIDC_DISCOVERY_ENDPOINT:-http://keycloak:8080/realms/tenderwriter/.well-known/openid-configuration}"
      TW_OIDC_CLIENT_ID: "${MM_OIDC_CLIENT_ID:-mattermost}"
      TW_OIDC_CLIENT_SECRET: "${MM_OIDC_CLIENT_SECRET:-CHANGE_ME_mattermost_client_secret}"
      TW_OIDC_BUTTON_TEXT: "${MM_OIDC_BUTTON_TEXT:-Accedi con Keycloak}"
      TW_OIDC_PUBLIC_BASE_URL: "${KEYCLOAK_URL:-http://localhost:8180}"
      TW_OIDC_INTERNAL_BASE_URL: "${KEYCLOAK_INTERNAL_URL:-http://keycloak:8080}"
    ports:
      - "${MM_PORT:-8065}:8065"
    volumes:
      - mm_data:/mattermost/data
      - mm_config:/mattermost/config
      - mm_logs:/mattermost/logs
      - mm_plugins:/mattermost/plugins
      - mm_client_plugins:/mattermost/client/plugins
      - mm_bleve_indexes:/mattermost/bleve-indexes

  # --- Jitsi Prosody (XMPP Server) ---
  jitsi-prosody:
    profiles: [ "videochat" ]
    image: jitsi/prosody:${JITSI_IMAGE_TAG:-stable-10741}
    container_name: tw-jitsi-prosody
    restart: unless-stopped
    environment:
      ENABLE_AUTH: ${JITSI_ENABLE_AUTH:-0}
      ENABLE_GUESTS: ${JITSI_ENABLE_GUESTS:-1}
      ENABLE_TRANSCRIPTIONS: ${JITSI_ENABLE_TRANSCRIPTIONS:-1}
      JICOFO_COMPONENT_SECRET: ${JITSI_JICOFO_COMPONENT_SECRET:-changeme-jicofo-component}
      JICOFO_AUTH_PASSWORD: ${JITSI_JICOFO_AUTH_PASSWORD:-changeme-jicofo}
      JVB_AUTH_PASSWORD: ${JITSI_JVB_AUTH_PASSWORD:-changeme-jvb}
      JIGASI_XMPP_PASSWORD: ${JITSI_JIGASI_XMPP_PASSWORD:-changeme-jigasi}
      JIGASI_TRANSCRIBER_PASSWORD: ${JITSI_JIGASI_TRANSCRIBER_PASSWORD:-changeme-transcriber}
      PUBLIC_URL: ${JITSI_PUBLIC_URL:-http://localhost:8880}
      XMPP_AUTH_DOMAIN: ${JITSI_XMPP_AUTH_DOMAIN:-auth.meet.jitsi}
      XMPP_DOMAIN: ${JITSI_XMPP_DOMAIN:-meet.jitsi}
      XMPP_GUEST_DOMAIN: ${JITSI_XMPP_GUEST_DOMAIN:-guest.meet.jitsi}
      XMPP_INTERNAL_MUC_DOMAIN: ${JITSI_XMPP_INTERNAL_MUC_DOMAIN:-internal-muc.meet.jitsi}
      XMPP_MUC_DOMAIN: ${JITSI_XMPP_MUC_DOMAIN:-muc.meet.jitsi}
      XMPP_RECORDER_DOMAIN: ${JITSI_XMPP_RECORDER_DOMAIN:-recorder.meet.jitsi}
      TZ: ${TZ:-Europe/Rome}
    volumes:
      - jitsi_prosody_cfg:/config

  # --- Jitsi Jicofo (Conference Focus) ---
  jitsi-jicofo:
    profiles: [ "videochat" ]
    image: jitsi/jicofo:${JITSI_IMAGE_TAG:-stable-10741}
    container_name: tw-jitsi-jicofo
    restart: unless-stopped
    depends_on:
      - jitsi-prosody
    environment:
      ENABLE_AUTH: ${JITSI_ENABLE_AUTH:-0}
      ENABLE_GUESTS: ${JITSI_ENABLE_GUESTS:-1}
      JICOFO_AUTH_USER: ${JITSI_JICOFO_AUTH_USER:-focus}
      JICOFO_AUTH_PASSWORD: ${JITSI_JICOFO_AUTH_PASSWORD:-changeme-jicofo}
      JICOFO_COMPONENT_SECRET: ${JITSI_JICOFO_COMPONENT_SECRET:-changeme-jicofo-component}
      JVB_BREWERY_MUC: ${JITSI_JVB_BREWERY_MUC:-jvbbrewery}
      PUBLIC_URL: ${JITSI_PUBLIC_URL:-http://localhost:8880}
      XMPP_AUTH_DOMAIN: ${JITSI_XMPP_AUTH_DOMAIN:-auth.meet.jitsi}
      XMPP_DOMAIN: ${JITSI_XMPP_DOMAIN:-meet.jitsi}
      XMPP_INTERNAL_MUC_DOMAIN: ${JITSI_XMPP_INTERNAL_MUC_DOMAIN:-internal-muc.meet.jitsi}
      XMPP_MUC_DOMAIN: ${JITSI_XMPP_MUC_DOMAIN:-muc.meet.jitsi}
      XMPP_SERVER: jitsi-prosody
      TZ: ${TZ:-Europe/Rome}
    volumes:
      - jitsi_jicofo_cfg:/config

  # --- Jitsi JVB (Video Bridge) ---
  jitsi-jvb:
    profiles: [ "videochat" ]
    image: jitsi/jvb:${JITSI_IMAGE_TAG:-stable-10741}
    container_name: tw-jitsi-jvb
    restart: unless-stopped
    depends_on:
      - jitsi-prosody
    environment:
      JVB_ADVERTISE_IPS: ${JITSI_JVB_ADVERTISE_IPS:-}
      JVB_AUTH_USER: ${JITSI_JVB_AUTH_USER:-jvb}
      JVB_AUTH_PASSWORD: ${JITSI_JVB_AUTH_PASSWORD:-changeme-jvb}
      JVB_BREWERY_MUC: ${JITSI_JVB_BREWERY_MUC:-jvbbrewery}
      XMPP_SERVER: jitsi-prosody
      XMPP_AUTH_DOMAIN: ${JITSI_XMPP_AUTH_DOMAIN:-auth.meet.jitsi}
      XMPP_DOMAIN: ${JITSI_XMPP_DOMAIN:-meet.jitsi}
      XMPP_INTERNAL_MUC_DOMAIN: ${JITSI_XMPP_INTERNAL_MUC_DOMAIN:-internal-muc.meet.jitsi}
      PUBLIC_URL: ${JITSI_PUBLIC_URL:-http://localhost:8880}
      TZ: ${TZ:-Europe/Rome}
    ports:
      - "10000:10000/udp"
    volumes:
      - jitsi_jvb_cfg:/config

  # --- Jitsi Web (Frontend) ---
  jitsi-web:
    profiles: [ "videochat" ]
    image: jitsi/web:${JITSI_IMAGE_TAG:-stable-10741}
    container_name: tw-jitsi-web
    restart: unless-stopped
    depends_on:
      - jitsi-prosody
    environment:
      ENABLE_GUESTS: ${JITSI_ENABLE_GUESTS:-1}
      ENABLE_TRANSCRIPTIONS: ${JITSI_ENABLE_TRANSCRIPTIONS:-1}
      PUBLIC_URL: ${JITSI_PUBLIC_URL:-http://localhost:8880}
      XMPP_AUTH_DOMAIN: ${JITSI_XMPP_AUTH_DOMAIN:-auth.meet.jitsi}
      XMPP_DOMAIN: ${JITSI_XMPP_DOMAIN:-meet.jitsi}
      XMPP_GUEST_DOMAIN: ${JITSI_XMPP_GUEST_DOMAIN:-guest.meet.jitsi}
      XMPP_INTERNAL_MUC_DOMAIN: ${JITSI_XMPP_INTERNAL_MUC_DOMAIN:-internal-muc.meet.jitsi}
      XMPP_MUC_DOMAIN: ${JITSI_XMPP_MUC_DOMAIN:-muc.meet.jitsi}
      XMPP_SERVER: jitsi-prosody
      TZ: ${TZ:-Europe/Rome}
    ports:
      - "${JITSI_WEB_PORT:-8880}:80"
      - "${JITSI_WEB_SSL_PORT:-8843}:443"
    volumes:
      - jitsi_web_cfg:/config

  # --- Vosk Speech-to-Text Server (Italian Model) ---
  vosk:
    profiles: [ "videochat" ]
    build:
      context: ./vosk-it
      dockerfile: Dockerfile
    image: tw-vosk-it:latest
    container_name: tw-vosk
    restart: unless-stopped
    ports:
      - "2700:2700"

  # --- Jigasi (transcriber mode -> Vosk STT) ---
  jitsi-jigasi:
    profiles: [ "videochat" ]
    image: jitsi/jigasi:${JITSI_IMAGE_TAG:-stable-10741}
    container_name: tw-jitsi-jigasi
    restart: unless-stopped
    depends_on:
      - vosk
      - jitsi-prosody
    environment:
      ENABLE_AUTH: ${JITSI_ENABLE_AUTH:-0}
      ENABLE_TRANSCRIPTIONS: ${JITSI_ENABLE_TRANSCRIPTIONS:-1}
      JIGASI_MODE: transcriber
      JIGASI_BREWERY_MUC: ${JITSI_JIGASI_BREWERY_MUC:-jigasibrewery}
      JIGASI_TRANSCRIBER_ADVERTISE_URL: "true"
      JIGASI_TRANSCRIBER_ENABLE_SAVING: "true"
      JIGASI_TRANSCRIBER_PASSWORD: ${JITSI_JIGASI_TRANSCRIBER_PASSWORD:-changeme-transcriber}
      JIGASI_TRANSCRIBER_SEND_TXT: "true"
      JIGASI_TRANSCRIBER_USER: ${JITSI_JIGASI_TRANSCRIBER_USER:-transcriber}
      JIGASI_TRANSCRIBER_VOSK_URL: ${JITSI_TRANSCRIBER_VOSK_URL:-ws://vosk:2700}
      JIGASI_XMPP_USER: ${JITSI_JIGASI_XMPP_USER:-jigasi}
      JIGASI_XMPP_PASSWORD: ${JITSI_JIGASI_XMPP_PASSWORD:-changeme-jigasi}
      PUBLIC_URL: ${JITSI_PUBLIC_URL:-http://localhost:8880}
      XMPP_AUTH_DOMAIN: ${JITSI_XMPP_AUTH_DOMAIN:-auth.meet.jitsi}
      XMPP_DOMAIN: ${JITSI_XMPP_DOMAIN:-meet.jitsi}
      XMPP_HIDDEN_DOMAIN: ${JITSI_XMPP_HIDDEN_DOMAIN:-hidden.meet.jitsi}
      XMPP_INTERNAL_MUC_DOMAIN: ${JITSI_XMPP_INTERNAL_MUC_DOMAIN:-internal-muc.meet.jitsi}
      XMPP_MUC_DOMAIN: ${JITSI_XMPP_MUC_DOMAIN:-muc.meet.jitsi}
      XMPP_RECORDER_DOMAIN: ${JITSI_XMPP_RECORDER_DOMAIN:-recorder.meet.jitsi}
      XMPP_SERVER: jitsi-prosody
      TZ: ${TZ:-Europe/Rome}
    volumes:
      - jitsi_jigasi_cfg:/config
      - jitsi_transcripts:/tmp/transcripts

  # --- Transcript Forwarder (Jigasi -> Mattermost Webhook) ---
  transcript-forwarder:
    profiles: [ "videochat" ]
    image: python:3.12-slim
    container_name: tw-transcript-forwarder
    restart: unless-stopped
    depends_on:
      mattermost:
        condition: service_started
      jitsi-jigasi:
        condition: service_started
    environment:
      MM_WEBHOOK_URL: ${MM_TRANSCRIPT_WEBHOOK_URL:-}
      POLL_INTERVAL_SECONDS: ${MM_TRANSCRIPT_POLL_INTERVAL_SECONDS:-5}
      TRANSCRIPT_STABLE_SECONDS: ${MM_TRANSCRIPT_STABLE_SECONDS:-20}
      TRANSCRIPT_WATCH_DIR: /tmp/transcripts
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./utility:/app:ro
      - jitsi_transcripts:/tmp/transcripts
    entrypoint: [ "/bin/sh", "-ec" ]
    command:
      - |
        if [ -z "$$MM_WEBHOOK_URL" ]; then
          echo "MM_WEBHOOK_URL is not configured; transcript forwarding is idle."
          exec tail -f /dev/null
        fi
        exec python /app/transcript_forwarder.py

volumes:
  postgres_data:
  qdrant_data:
  neo4j_data:
  ollama_data: # Kept for potential future Ollama use
  minio_data:
  redis_data:
  onlyoffice_data:
  onlyoffice_lib:
  llama_tender_cache:
  llama_opencode_cache:
  opencode_config:
  opencode_data:
  kc_postgres_data:
  mm_postgres_data:
  mm_data:
  mm_config:
  mm_logs:
  mm_plugins:
  mm_client_plugins:
  mm_bleve_indexes:
  jitsi_prosody_cfg:
  jitsi_jicofo_cfg:
  jitsi_jvb_cfg:
  jitsi_web_cfg:
  jitsi_jigasi_cfg:
  jitsi_transcripts:
